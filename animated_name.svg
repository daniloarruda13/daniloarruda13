<svg fill="none" viewBox="0 0 900 180" width="900" height="180"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Danilo Arruda</title>
  <desc id="description">Data scientist working across biomechanics, virtual reality, and sports research.</desc>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="container">
      <style>
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .container {
          --start: #312e81;
          --middle: #0369a1;
          --end: #0f766e;
          align-items: center;
          animation: gradient 14s ease infinite;
          background: linear-gradient(120deg, var(--start), var(--middle), var(--end));
          background-size: 300% 300%;
          border-radius: 18px;
          box-sizing: border-box;
          color: #ffffff;
          display: flex;
          flex-direction: column;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          height: 180px;
          justify-content: center;
          text-align: center;
          width: 100%;
        }

        h1 {
          font-size: 38px;
          line-height: 1.1;
          margin: 0 18px 12px;
        }

        p {
          font-size: 18px;
          letter-spacing: 0.02em;
          margin: 0 18px;
        }

        @media (prefers-color-scheme: light) {
          .container {
            --start: #7c3aed;
            --middle: #0369a1;
            --end: #047857;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .container { animation: none; }
        }
      </style>
      <h1>Hi, I’m Danilo Arruda</h1>
      <p>Data Science · Biomechanics · Virtual Reality · Sports Research</p>
    </div>
  </foreignObject>
</svg>
